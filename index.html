<title>Friendsly</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7F5FF;
  --surface:#FFFFFF;
  --surface-2:#F0ECFF;
  --border:#E3DCFF;
  --text:#1B1035;
  --text-muted:#6B6180;
  --accent:#5B3DF5;
  --accent-dark:#4526E0;
  --accent-soft:#EDE8FF;
  --success:#1FAE5C;
  --success-soft:#E3F9EC;
  --error:#F0355A;
  --error-soft:#FEE7EC;
  --gold:#F5A623;
  --shadow: 0 2px 0 var(--border);
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#150E28;
    --surface:#201735;
    --surface-2:#271D40;
    --border:#382C57;
    --text:#F3EFFF;
    --text-muted:#B3A6D6;
    --accent:#8B7CFA;
    --accent-dark:#A497FF;
    --accent-soft:#2E2350;
    --success:#3DDC84;
    --success-soft:#173327;
    --error:#FF5C7C;
    --error-soft:#3A1826;
    --gold:#F6BB4E;
    --shadow: 0 2px 0 var(--border);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#150E28;
  --surface:#201735;
  --surface-2:#271D40;
  --border:#382C57;
  --text:#F3EFFF;
  --text-muted:#B3A6D6;
  --accent:#8B7CFA;
  --accent-dark:#A497FF;
  --accent-soft:#2E2350;
  --success:#3DDC84;
  --success-soft:#173327;
  --error:#FF5C7C;
  --error-soft:#3A1826;
  --gold:#F6BB4E;
  --shadow: 0 2px 0 var(--border);
  color-scheme: dark;
}

*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:'Inter',system-ui,sans-serif;
  padding-inline:16px;
  padding-block:20px;
  display:flex;
  justify-content:center;
}
h1,h2,h3,.display{font-family:'Baloo 2',system-ui,sans-serif;text-wrap:balance;}

#app{
  width:100%;
  max-width:480px;
  display:flex;
  flex-direction:column;
  gap:16px;
}

/* ---------- Top bar ---------- */
.topbar{
  display:flex;
  align-items:center;
  gap:12px;
  min-height:36px;
}
.iconbtn{
  border:none;
  background:none;
  color:var(--text-muted);
  font-size:22px;
  cursor:pointer;
  padding:4px 8px;
  border-radius:10px;
  line-height:1;
}
.iconbtn:hover{background:var(--surface-2);}
.progress-track{
  flex:1;
  height:14px;
  background:var(--surface-2);
  border-radius:999px;
  overflow:hidden;
  border:1px solid var(--border);
}
.progress-fill{
  height:100%;
  background:var(--success);
  border-radius:999px;
  transition:width .35s ease;
  width:0%;
}
.stat{
  display:flex;
  align-items:center;
  gap:4px;
  font-weight:800;
  font-family:'Baloo 2',sans-serif;
  font-size:15px;
  white-space:nowrap;
}
.stat.hearts{color:var(--error);}
.stat.streak{color:var(--gold);}

/* ---------- Home screen ---------- */
.hero{
  background:linear-gradient(155deg,var(--accent) 0%, var(--accent-dark) 100%);
  color:#fff;
  border-radius:24px;
  padding:22px 20px;
  display:flex;
  align-items:center;
  gap:16px;
  box-shadow:0 6px 0 var(--accent-dark);
}
.hero .avatar{
  width:56px;height:56px;border-radius:16px;
  background:rgba(255,255,255,.18);
  display:flex;align-items:center;justify-content:center;
  font-size:30px;flex-shrink:0;
}
.hero h1{margin:0 0 2px;font-size:22px;color:#fff;}
.hero p{margin:0;font-size:13.5px;opacity:.9;}

.section-title{
  font-size:13px;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.06em;
  color:var(--text-muted);
  margin:4px 2px 0;
}

.path{
  display:flex;
  flex-direction:column;
  gap:12px;
}
.unit-card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:18px;
  padding:16px;
  display:flex;
  align-items:center;
  gap:14px;
  cursor:pointer;
  box-shadow:var(--shadow);
  position:relative;
  transition:transform .12s ease;
}
.unit-card:active{transform:scale(.98);}
.unit-card.locked{opacity:.55;cursor:not-allowed;}
.unit-badge{
  width:52px;height:52px;border-radius:14px;
  display:flex;align-items:center;justify-content:center;
  font-size:26px;flex-shrink:0;
  background:var(--accent-soft);
  color:var(--accent);
  border:2px solid var(--border);
}
.unit-card.done .unit-badge{background:var(--success-soft);color:var(--success);border-color:var(--success);}
.unit-card.current .unit-badge{background:var(--accent);color:#fff;border-color:var(--accent-dark);}
.unit-info{flex:1;min-width:0;}
.unit-info h3{margin:0 0 3px;font-size:16.5px;}
.unit-info p{margin:0;font-size:12.5px;color:var(--text-muted);}
.unit-chevron{color:var(--text-muted);font-size:20px;}
.mini-progress{
  position:absolute;left:16px;right:16px;bottom:8px;
  height:5px;background:var(--surface-2);border-radius:999px;overflow:hidden;
}
.mini-progress i{display:block;height:100%;background:var(--success);}

/* ---------- Exercise screen ---------- */
.card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:20px;
  padding:20px;
  box-shadow:var(--shadow);
}
.prompt-kicker{
  font-size:12px;font-weight:700;color:var(--accent);
  text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px;
}
.prompt{font-size:19px;font-weight:700;margin:0 0 4px;font-family:'Baloo 2',sans-serif;}
.prompt-sub{font-size:14px;color:var(--text-muted);margin:0 0 16px;}

.choices{display:flex;flex-direction:column;gap:10px;}
.choice{
  border:2px solid var(--border);
  background:var(--surface);
  color:var(--text);
  border-radius:14px;
  padding:13px 16px;
  font-size:15.5px;
  font-weight:600;
  text-align:left;
  cursor:pointer;
  font-family:inherit;
  transition:border-color .12s, background .12s, transform .08s;
}
.choice:hover{border-color:var(--accent);}
.choice:active{transform:scale(.985);}
.choice.selected{border-color:var(--accent);background:var(--accent-soft);}
.choice.correct{border-color:var(--success);background:var(--success-soft);color:var(--success);}
.choice.wrong{border-color:var(--error);background:var(--error-soft);color:var(--error);}
.choice[disabled]{cursor:default;}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

.match-cols{display:flex;gap:10px;}
.match-col{flex:1;display:flex;flex-direction:column;gap:8px;}
.match-item{
  border:2px solid var(--border);
  background:var(--surface);
  border-radius:12px;
  padding:11px 10px;
  font-size:14px;
  font-weight:600;
  text-align:center;
  cursor:pointer;
  min-height:44px;
  display:flex;align-items:center;justify-content:center;
}
.match-item.selected{border-color:var(--accent);background:var(--accent-soft);}
.match-item.matched{border-color:var(--success);background:var(--success-soft);color:var(--success);opacity:.7;cursor:default;}
.match-item.wrongflash{border-color:var(--error);background:var(--error-soft);}

.blank-input{
  width:100%;
  border:2px solid var(--border);
  border-radius:14px;
  padding:13px 16px;
  font-size:16px;
  font-family:inherit;
  background:var(--surface);
  color:var(--text);
  margin-bottom:4px;
}
.blank-input:focus{outline:none;border-color:var(--accent);}
.blank-input.correct{border-color:var(--success);background:var(--success-soft);}
.blank-input.wrong{border-color:var(--error);background:var(--error-soft);}

/* ---------- Bottom action bar ---------- */
.bottom-bar{
  position:sticky;
  bottom:0;
  padding-top:10px;
  padding-bottom:calc(6px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(var(--bg-fade,transparent), var(--bg) 30%);
}
.btn{
  width:100%;
  border:none;
  border-radius:16px;
  padding:15px 20px;
  font-size:16px;
  font-weight:800;
  font-family:'Baloo 2',sans-serif;
  cursor:pointer;
  letter-spacing:.02em;
}
.btn-primary{background:var(--accent);color:#fff;box-shadow:0 4px 0 var(--accent-dark);}
.btn-primary:active{box-shadow:0 1px 0 var(--accent-dark);transform:translateY(3px);}
.btn-primary:disabled{background:var(--surface-2);color:var(--text-muted);box-shadow:none;cursor:not-allowed;}
.btn-success{background:var(--success);color:#fff;box-shadow:0 4px 0 #158247;}
.btn-error{background:var(--error);color:#fff;box-shadow:0 4px 0 #b7203c;}
.btn-ghost{background:none;color:var(--accent);box-shadow:none;text-decoration:underline;padding:8px;}

.feedback-panel{
  border-radius:18px;
  padding:14px 16px;
  display:flex;
  align-items:flex-start;
  gap:12px;
  margin-bottom:10px;
}
.feedback-panel.ok{background:var(--success-soft);color:var(--success);}
.feedback-panel.ko{background:var(--error-soft);color:var(--error);}
.feedback-panel .emoji{font-size:24px;}
.feedback-panel .fb-title{font-family:'Baloo 2',sans-serif;font-weight:700;font-size:16px;margin:0 0 3px;}
.feedback-panel .fb-text{font-size:13.5px;margin:0;color:var(--text);opacity:.85;}

/* ---------- Result screen ---------- */
.result-wrap{text-align:center;padding:20px 6px;}
.result-emoji{font-size:64px;margin-bottom:6px;}
.result-stats{display:flex;justify-content:center;gap:10px;margin:18px 0;}
.stat-pill{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:14px;
  padding:12px 16px;
  min-width:84px;
}
.stat-pill .num{font-family:'Baloo 2',sans-serif;font-size:22px;font-weight:800;display:block;}
.stat-pill .lbl{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em;}

.hidden{display:none!important;}

.hearts-lost-note{font-size:12px;color:var(--text-muted);text-align:center;margin-top:2px;}

/* ---------- Home top row & modal ---------- */
.home-toprow{display:flex;justify-content:flex-end;gap:8px;}
.pill-btn{
  border:1px solid var(--border);
  background:var(--surface);
  color:var(--text);
  border-radius:999px;
  padding:7px 13px;
  font-size:12.5px;
  font-weight:700;
  font-family:'Inter',sans-serif;
  cursor:pointer;
  display:flex;
  align-items:center;
  gap:5px;
}
.pill-btn:hover{border-color:var(--accent);color:var(--accent);}
.pill-btn.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);}

.parent-banner{
  background:var(--accent-soft);
  border:1px dashed var(--accent);
  border-radius:14px;
  padding:10px 14px;
  font-size:12.5px;
  color:var(--accent-dark);
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}
.parent-banner button{
  border:none;background:none;color:var(--accent-dark);
  font-weight:700;text-decoration:underline;cursor:pointer;
  font-size:12.5px;padding:2px;white-space:nowrap;
  font-family:inherit;
}

.modal-overlay{
  position:fixed;inset:0;
  background:rgba(20,10,40,.45);
  display:flex;align-items:flex-end;justify-content:center;
  z-index:50;
  padding:0;
}
@media (min-width:520px){
  .modal-overlay{align-items:center;}
}
.modal-sheet{
  background:var(--surface);
  width:100%;max-width:480px;
  border-radius:22px 22px 0 0;
  padding:22px 20px calc(20px + env(safe-area-inset-bottom,0px));
  max-height:85vh;
  overflow-y:auto;
}
@media (min-width:520px){
  .modal-sheet{border-radius:22px;max-height:80vh;}
}
.modal-sheet h2{margin:0 0 4px;font-size:21px;}
.modal-sheet .modal-sub{color:var(--text-muted);font-size:13.5px;margin:0 0 16px;}
.modal-sheet h3{font-size:14.5px;margin:18px 0 8px;}
.modal-sheet ol,.modal-sheet ul{margin:0;padding-left:20px;font-size:14px;line-height:1.55;}
.modal-sheet li{margin-bottom:6px;}
.modal-sheet .legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px;}
.legend-chip{
  display:flex;align-items:center;gap:6px;
  background:var(--surface-2);border-radius:999px;
  padding:6px 12px;font-size:12.5px;font-weight:600;
}
.modal-close-x{
  position:absolute;top:14px;right:14px;
  border:none;background:var(--surface-2);color:var(--text-muted);
  width:32px;height:32px;border-radius:999px;font-size:16px;cursor:pointer;
}
.modal-sheet{position:relative;}

/* ---------- Translation toggle & hints ---------- */
.translation-hint{
  margin-top:10px;
  background:var(--surface-2);
  border-left:3px solid var(--accent);
  border-radius:10px;
  padding:10px 12px;
  font-size:13.5px;
  color:var(--text);
  display:flex;
  gap:8px;
  align-items:flex-start;
}
.translation-hint .flag{flex-shrink:0;}
.match-item .item-fr{
  display:block;
  font-size:10.5px;
  font-weight:500;
  color:var(--text-muted);
  margin-top:2px;
}
.choice .opt-fr{
  display:block;
  font-size:11.5px;
  font-weight:500;
  color:var(--text-muted);
  margin-top:2px;
}
</style>

<script>
(function(){
"use strict";

/* ============================================================
   CONTENT — English Unit 1, "My Friends and I" (Gaspard, 4e/2e degré)
   Sourced from: personality adjectives, relationships vocab,
   friendship idioms, family vocab, present perfect vs past simple,
   for/since, expressing purpose (to / in order to / so as to).
   ============================================================ */

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function pick(arr,n){ return shuffle(arr).slice(0,n); }

/* Global dictionary translating every possible MCQ option/distractor used across
   the exercise banks below, so the translation toggle can show a French line
   under each answer choice without duplicating strings at every call site. */
const OPTION_TRANSLATIONS = {
  // friends-vocab common-mistake distractors
  "see":"voir", "get on":"bien s'entendre", "fall out":"se brouiller", "look":"regarder",
  "make":"faire/se faire", "get":"obtenir", "find":"trouver", "take":"prendre",
  // family common mistake
  "Thomas's wife":"la femme de Thomas (avec 's)", "the wife of Thomas":"la femme de Thomas (avec 'of')",
  "the Thomas's wife":"mélange des deux structures", "wife of the Thomas":"article en trop devant Thomas",
  // present perfect vs past simple verb forms
  "have known":"ai connu / connais", "knew":"connaissais", "did know":"forme avec did", "have know":"verbe non conjugué après have",
  "met":"ai rencontré", "have met":"ai rencontré", "have meet":"verbe non conjugué après have", "did met":"mélange did + participe passé",
  "changed":"a changé", "has changed":"a changé", "have changed":"forme avec have (sujet pluriel)", "was changed":"a été changé (passif)",
  "haven't seen":"n'avons pas vu", "didn't see":"n'avons pas vu", "haven't see":"verbe non conjugué après haven't", "don't see":"ne voyons pas",
  "donated":"a donné", "have donated":"a donné", "has donated":"a donné", "did donated":"mélange did + forme en -ed",
  "has taken care of":"s'occupe de", "took care of":"s'est occupé de", "is taking care of":"s'occupe de (en ce moment)", "take care of":"s'occuper de",
  "have never organized":"n'avons jamais organisé", "never organized":"forme sans auxiliaire", "didn't organized":"mélange didn't + forme en -ed", "never organize":"verbe à l'infinitif",
  "has helped":"a aidé", "helped":"a aidé", "help":"aider", "was helping":"aidait",
  "grew up":"a grandi", "has grown up":"a grandi", "have grown up":"forme avec have (sujet singulier)", "was grow up":"mélange was + verbe de base",
  "was":"était", "has been":"a été", "have been":"forme avec have (sujet singulier)", "were":"étaient",
  "since":"depuis (point de départ)", "for":"pendant/depuis (durée)", "ago":"il y a", "when":"quand",
  "have met / went":"ai rencontré / suis allé", "met / have gone":"formes inversées", "have met / have gone":"les deux au present perfect", "met / went":"les deux au past simple",
  // expressing purpose
  "in order to":"afin de", "for to":"structure avec for + to", "for raise":"structure avec for + verbe de base",
  "to":"pour", "for raising":"structure avec for + -ing",
  "so as to":"afin de", "in order for":"structure avec in order for",
  "for + verb":"FOR + verbe", "to + verb":"TO + verbe", "in order to + verb":"IN ORDER TO + verbe", "so as to + verb":"SO AS TO + verbe",
  "for reaching":"structure avec for + -ing"
};
function translateOption(opt){
  return OPTION_TRANSLATIONS[opt] || null;
}

function mcq(prompt, sub, correct, distractors, opts){
  opts = opts || {};
  const options = shuffle([correct].concat(distractors));
  const optionsFr = opts.optionsFr || {};
  options.forEach(o=>{ if(!optionsFr[o]){ const t = translateOption(o); if(t) optionsFr[o] = t; } });
  return {
    type:"mcq", prompt, sub, correct,
    options,
    explain: opts.explain || "",
    fr: opts.fr || null,          // French translation of the prompt/sentence
    optionsFr                     // map: english option -> French translation
  };
}
function typed(prompt, sub, answers, opts){
  opts = opts || {};
  return { type:"typed", prompt, sub, answers: Array.isArray(answers)?answers:[answers], explain: opts.explain||"", fr: opts.fr || null };
}
function match(prompt, pairs, opts){
  opts = opts || {};
  // pairs: [{left, right, leftFr?, rightFr?}]
  return { type:"match", prompt, pairs, explain: opts.explain||"", fr: opts.fr || null };
}

const UNITS = [
  {
    id: "personality",
    title: "Personality",
    icon: "🧠",
    blurb: "Adjectives to describe someone's character",
    exercises: buildPersonalityExercises()
  },
  {
    id: "opposites",
    title: "Opposites",
    icon: "⚖️",
    blurb: "Positive & negative character traits",
    exercises: buildOppositesExercises()
  },
  {
    id: "friends-vocab",
    title: "Friends & Relationships",
    icon: "🤝",
    blurb: "BFF, mate, acquaintance... and phrases",
    exercises: buildFriendsExercises()
  },
  {
    id: "idioms",
    title: "Friendship Idioms",
    icon: "💬",
    blurb: "Bury the hatchet, see eye to eye...",
    exercises: buildIdiomsExercises()
  },
  {
    id: "family",
    title: "Family",
    icon: "👪",
    blurb: "Widow, elder, twins, in-laws...",
    exercises: buildFamilyExercises()
  },
  {
    id: "grammar-tenses",
    title: "Grammar: Present Perfect vs Past Simple",
    icon: "⏳",
    blurb: "Choose the right tense",
    exercises: buildTenseExercises()
  },
  {
    id: "grammar-forsince",
    title: "Grammar: FOR / SINCE",
    icon: "🕰️",
    blurb: "Duration vs starting point",
    exercises: buildForSinceExercises()
  },
  {
    id: "grammar-purpose",
    title: "Grammar: Expressing Purpose",
    icon: "🎯",
    blurb: "to / in order to / so as to (never 'for + V')",
    exercises: buildPurposeExercises()
  }
];

/* ============================================================
   LISTENING — texts read aloud by the browser's speech synthesis,
   with comprehension questions answered without seeing the text.
   Two texts are from the chapter's reading passages (Rebecca / Tina
   & Will); three more are original stories reusing the chapter's
   vocabulary and grammar (idioms, present perfect/past simple,
   for/since) so Gaspard has fresh, unseen listening material.
   ============================================================ */
const LISTENING_TEXTS = [
  {
    id: "rebecca",
    title: "My friend Rebecca",
    blurb: "Kylie talks about her friendship with Rebecca",
    lang: "en-GB",
    text: "I have known my friend Rebecca for a long time. We first met at a friend's birthday party five years ago. We found out that we both liked techno and Green Day. So, I invited Rebecca over to my place. We listened to music together and soon became best friends. Three years ago, Rebecca's parents invited me to go on holiday with them. It was great! We spent three wonderful weeks in a little cottage in Ireland. Rebecca and I loved walking along the beautiful beach. We took a lot of photos and had a lot of fun. Two years ago, I spent a week in hospital and Rebecca came to see me every day. But then, last year, Rebecca's father changed his job, and they moved to another town. Since then, we haven't seen each other very much, but we've talked on the phone or via Skype and we've written e-mails to each other.",
    questions: [
      mcq("Where did Kylie and Rebecca first meet?","Choose the correct answer.","At a friend's birthday party",["At school","On holiday in Ireland","At the hospital"],{fr:"Où Kylie et Rebecca se sont-elles rencontrées pour la première fois ?", optionsFr:{"At a friend's birthday party":"À l'anniversaire d'un ami","At school":"À l'école","On holiday in Ireland":"En vacances en Irlande","At the hospital":"À l'hôpital"}}),

/* ---------- 1. Personality adjectives (meaning matching) ---------- */
function buildPersonalityExercises(){
  // [english word, english definition, french word, french definition]
  const defs = [
    ["confident","feeling sure about yourself and your abilities","confiant(e)","sûr(e) de soi et de ses capacités"],
    ["shy","not confident, especially about meeting new people","timide","pas à l'aise, surtout pour rencontrer de nouvelles personnes"],
    ["reliable","can be trusted to do what people expect you to do","fiable","à qui on peut faire confiance"],
    ["hard-working","putting a lot of effort into your work","travailleur/travailleuse","qui fait beaucoup d'efforts dans son travail"],
    ["patient","able to stay calm and not get angry when things take time","patient(e)","capable de rester calme sans s'énerver"],
    ["impatient","not able to wait calmly; gets annoyed by delays","impatient(e)","incapable d'attendre calmement"],
    ["sensible","practical; doesn't do stupid things","raisonnable, sensé(e)","pratique, ne fait pas de bêtises"],
    ["creative","good at thinking of new ideas and using imagination","créatif/créative","doué(e) pour imaginer de nouvelles idées"],
    ["talented","has a natural ability for something","talentueux/talentueuse","possède un don naturel pour quelque chose"],
    ["tolerant","able to accept differences in other people","tolérant(e)","capable d'accepter les différences chez les autres"],
    ["headstrong","determined to do things your own way","têtu(e)","déterminé(e) à faire les choses à sa manière"],
    ["caring","kind and concerned about other people's feelings","attentionné(e)","gentil(le) et attentif/attentive aux sentiments des autres"]
  ];
  const ex = [];
  const defFrByEnglishDef = Object.fromEntries(defs.map(([w,d,wFr,dFr])=>[d,dFr]));
  const wordFrByWord = Object.fromEntries(defs.map(([w,d,wFr])=>[w,wFr]));
  defs.forEach(([word,def,wFr,dFr])=>{
    const distractors = pick(defs.filter(d=>d[0]!==word).map(d=>d[1]), 3);
    const optionsFr = {}; [def,...distractors].forEach(d=> optionsFr[d]=defFrByEnglishDef[d]);
    ex.push(mcq(`What does "${word}" mean?`, "Choose the correct definition.", def, distractors, {fr:`Que veut dire "${word}" (${wFr}) ?`, optionsFr}));
  });
  // reverse direction: definition -> word
  pick(defs, 6).forEach(([word,def,wFr])=>{
    const distractors = pick(defs.filter(d=>d[0]!==word).map(d=>d[0]), 3);
    const optionsFr = {}; [word,...distractors].forEach(w=> optionsFr[w]=wordFrByWord[w]);
    ex.push(mcq(`"${def}"`, "Which adjective matches this definition?", word, distractors, {fr:`Quel adjectif correspond à : "${def}" ?`, optionsFr}));
  });
  // matching round
  ex.push(match("Match each adjective to its meaning.", pick(defs,4).map(([w,d,wFr])=>({left:w,right:d,leftFr:wFr})), {fr:"Associe chaque adjectif à sa définition."}));
  ex.push(match("Match each adjective to its meaning.", pick(defs,4).map(([w,d,wFr])=>({left:w,right:d,leftFr:wFr})), {fr:"Associe chaque adjectif à sa définition."}));
  // fill the blank
  const fillBank = [
    ["My sister can't wait for anything; she's so ____.", ["impatient"], "Ma sœur ne peut rien attendre ; elle est tellement ____ (impatiente)."],
    ["I get very ____ before exams; I need to relax more.", ["nervous","anxious"], "Je deviens très ____ (nerveux) avant les examens ; je dois me détendre davantage."],
    ["He's so ____, I could paint as well as your brother.", ["creative"], "Il est tellement ____ (créatif), je pourrais peindre aussi bien que ton frère."],
    ["Adeline hasn't done a thing since she's here. She's so ____.", ["lazy"], "Adeline n'a rien fait depuis qu'elle est là. Elle est tellement ____ (paresseuse)."],
    ["I always have a laugh with my cousin, he's got a great sense of ____.", ["humour"], "Je rigole toujours avec mon cousin, il a un grand sens de l'____ (humour)."],
    ["My younger sister understands new ideas so quickly; she's very ____.", ["clever","intelligent"], "Ma petite sœur comprend les nouvelles idées si vite ; elle est très ____ (intelligente)."],
    ["If Sarah says she'll do it, she'll do it. I ____ her completely.", ["trust"], "Si Sarah dit qu'elle le fera, elle le fera. Je lui fais totalement ____ (confiance)."],
    ["He failed his exams, but he isn't ____. He just didn't work.", ["stupid"], "Il a raté ses examens, mais il n'est pas ____ (stupide). Il n'a juste pas travaillé."]
  ];
  fillBank.forEach(([q,answers,fr])=> ex.push(typed(q,"Type the missing word.",answers,{fr})));
  return shuffle(ex);
}

/* ---------- 2. Opposites ---------- */
function buildOppositesExercises(){
  // [positive, negative, positive FR, negative FR]
  const pairs = [
    ["generous","mean","généreux/généreuse","radin(e), mesquin(e)"],
    ["honest","dishonest","honnête","malhonnête"],
    ["clever","stupid","intelligent(e)","stupide"],
    ["calm","nervous","calme","nerveux/nerveuse"],
    ["kind","unkind","gentil(le)","méchant(e)"],
    ["friendly","unfriendly","amical(e)","peu amical(e)"],
    ["pleasant","unpleasant","agréable","désagréable"],
    ["patient","impatient","patient(e)","impatient(e)"],
    ["reliable","unreliable","fiable","peu fiable"]
  ];
  const ex = [];
  const negFrByNeg = Object.fromEntries(pairs.map(([p,n,pFr,nFr])=>[n,nFr]));
  pairs.forEach(([pos,neg,posFr,negFr])=>{
    const distractors = pick(pairs.filter(p=>p[1]!==neg).map(p=>p[1]),3);
    const optionsFr = {}; [neg,...distractors].forEach(n=> optionsFr[n]=negFrByNeg[n]);
    ex.push(mcq(`What is the opposite of "${pos}"?`,"Choose the correct word.", neg, distractors, {fr:`Quel est le contraire de "${pos}" (${posFr}) ?`, optionsFr}));
  });
  ex.push(match("Match the positive adjective to its opposite.", pick(pairs,4).map(([p,n,pFr,nFr])=>({left:p,right:n,leftFr:pFr,rightFr:nFr})), {fr:"Associe chaque adjectif positif à son contraire."}));
  ex.push(match("Match the positive adjective to its opposite.", pick(pairs,4).map(([p,n,pFr,nFr])=>({left:p,right:n,leftFr:pFr,rightFr:nFr})), {fr:"Associe chaque adjectif positif à son contraire."}));
  const prefixBank = [
    ["kind → ____kind", "unkind", "gentil → mal____ (le contraire)"],
    ["friendly → ____friendly", "unfriendly", "amical → peu ____ (le contraire)"],
    ["____pleasant (opposite of pleasant)", "unpleasant", "____agréable (le contraire d'agréable)"],
    ["____patient (opposite of patient)", "impatient", "____patient (le contraire de patient)"],
    ["____honest (opposite of honest)", "dishonest", "____honnête (le contraire d'honnête)"],
    ["____reliable (opposite of reliable)", "unreliable", "____fiable (le contraire de fiable)"]
  ];
  prefixBank.forEach(([q,a,fr])=> ex.push(typed(q,"Write the opposite using the correct prefix (un-/im-/dis-).",[a],{fr})));
  return shuffle(ex);
}

/* ---------- 4. Friendship idioms ---------- */
function buildIdiomsExercises(){
  // [english idiom, english meaning, french translation]
  const idioms = [
    ["a shoulder to cry on","someone who listens to your problems","une épaule sur laquelle pleurer"],
    ["see eye to eye","to agree with someone","être sur la même longueur d'onde"],
    ["hate someone's guts","to very strongly dislike someone","détester quelqu'un profondément"],
    ["clear the air","to talk about a problem you've been avoiding","crever l'abcès, clarifier la situation"],
    ["bury the hatchet","to stop fighting or quarrelling","enterrer la hache de guerre"],
    ["patch up our differences","to settle an argument","régler nos différends"],
    ["through thick and thin","friends who share good times and difficult times together","à travers vents et marées"],
    ["a fair-weather friend","a friend who is only there when things go well for you","un ami des beaux jours seulement"]
  ];
  const ex = [];
  const frByMeaning = Object.fromEntries(idioms.map(([w,d,fr])=>[d,fr]));
  const frByIdiom = Object.fromEntries(idioms.map(([w,d,fr])=>[w,fr]));
  idioms.forEach(([w,d,fr])=>{
    const distractors = pick(idioms.filter(x=>x[1]!==d).map(x=>x[1]),3);
    const optionsFr = {}; [d,...distractors].forEach(dd=> optionsFr[dd]=frByMeaning[dd]);
    ex.push(mcq(`What does "${w}" mean?`,"Choose the correct definition.", d, distractors, {fr:`Que veut dire "${w}" ?`, optionsFr}));
  });
  idioms.forEach(([w,d,fr])=>{
    const distractors = pick(idioms.filter(x=>x[0]!==w).map(x=>x[0]),3);
    const optionsFr = {}; [w,...distractors].forEach(ww=> optionsFr[ww]=frByIdiom[ww]);
    ex.push(mcq(`"${d}"`,"Which idiom matches this definition?", w, distractors, {fr:`Quel idiome correspond à cette définition ?`, optionsFr}));
  });
  ex.push(match("Match the idiom to its meaning.", pick(idioms,4).map(([w,d,fr])=>({left:w,right:d,leftFr:fr})), {fr:"Associe chaque expression idiomatique à sa définition."}));
  ex.push(match("Match the idiom to its meaning.", pick(idioms,4).map(([w,d,fr])=>({left:w,right:d,leftFr:fr})), {fr:"Associe chaque expression idiomatique à sa définition."}));
  return shuffle(ex);
}

/* ---------- 6. Grammar: present perfect vs past simple ---------- */
function buildTenseExercises(){
  const ex = [];
  const items = [
    {sentence:"I ____ (know) Rebecca for a long time.", answer:"have known", distractors:["knew","did know","have know"], explain:"Unfinished duration up to now → present perfect.", fr:"Je connais Rebecca depuis longtemps (durée non terminée → present perfect)."},
    {sentence:"We ____ (meet) at a friend's birthday party five years ago.", answer:"met", distractors:["have met","have meet","did met"], explain:"'Five years ago' is a finished time in the past → past simple.", fr:"On s'est rencontrés à l'anniversaire d'un ami il y a cinq ans (moment précis et terminé → past simple)."},
    {sentence:"Last year, Rebecca's father ____ (change) his job.", answer:"changed", distractors:["has changed","have changed","was changed"], explain:"'Last year' = finished past time → past simple.", fr:"L'année dernière, le père de Rebecca a changé de travail (moment terminé → past simple)."},
    {sentence:"Since then, we ____ (not/see) each other very much.", answer:"haven't seen", distractors:["didn't see","haven't see","don't see"], explain:"'Since then' connects the past to now → present perfect.", fr:"Depuis, on ne s'est pas beaucoup vus (lien passé-présent → present perfect)."},
    {sentence:"Brad Pitt and Angelina Jolie ____ (donate) $1,000,000 when they launched their foundation.", answer:"donated", distractors:["have donated","has donated","did donated"], explain:"A specific finished past event → past simple.", fr:"Brad Pitt et Angelina Jolie ont donné 1 000 000 $ quand ils ont lancé leur fondation (événement précis et terminé → past simple)."},
    {sentence:"The RSPCA ____ (take care of) animals since 1824.", answer:"has taken care of", distractors:["took care of","is taking care of","take care of"], explain:"'Since 1824' → action continuing to now → present perfect.", fr:"La RSPCA s'occupe d'animaux depuis 1824 (action qui continue → present perfect)."},
    {sentence:"We ____ (never/organize) a Red Nose Day in my school so far.", answer:"have never organized", distractors:["never organized","didn't organized","never organize"], explain:"'So far' signals present perfect.", fr:"On n'a encore jamais organisé de Red Nose Day dans mon école (jusqu'à présent → present perfect)."},
    {sentence:"Every 15 seconds a person dies from TB. Damian Action ____ (help) fight this disease since 1964.", answer:"has helped", distractors:["helped","help","was helping"], explain:"'Since 1964' → present perfect.", fr:"Toutes les 15 secondes, une personne meurt de la tuberculose. Damian Action aide à combattre cette maladie depuis 1964 (present perfect)."},
    {sentence:"She was born in Hawaii but she ____ (grow up) in Sydney.", answer:"grew up", distractors:["has grown up","have grown up","was grow up"], explain:"Completed single past event → past simple.", fr:"Elle est née à Hawaï mais elle a grandi à Sydney (événement terminé unique → past simple)."},
    {sentence:"She first appeared on stage when she ____ (be) five.", answer:"was", distractors:["has been","have been","were"], explain:"'When she was five' = specific past moment → past simple.", fr:"Elle est montée sur scène pour la première fois quand elle avait cinq ans (moment précis dans le passé → past simple)."},
    {sentence:"She has been an actress ever ____.", answer:"since", distractors:["for","ago","when"], explain:"'Ever since' pairs with present perfect.", fr:"Elle est actrice depuis (ever ____) — expression qui s'utilise avec le present perfect."},
    {sentence:"Guess what! I ____ (meet) a wonderful man. We ____ (go) to the cinema together last night.", answer:"have met / went", distractors:["met / have gone","have met / have gone","met / went"], explain:"News announced now = present perfect; specific past detail ('last night') = past simple.", fr:"Devine quoi ! J'ai rencontré un homme formidable. On est allés au cinéma ensemble hier soir (annonce d'une nouvelle = present perfect ; détail précis 'hier soir' = past simple)."}
  ];
  items.forEach(it=>{
    ex.push(mcq(it.sentence, "Choose the correct verb form.", it.answer, it.distractors, {explain:it.explain, fr:it.fr}));
  });
  return shuffle(ex);
}

/* ============================================================
   STATE
   ============================================================ */
const STORAGE_KEY = "friendsly_progress_v1";

function loadState(){
  let saved = {};
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) saved = JSON.parse(raw);
  }catch(e){}
  return Object.assign({
    completedUnits:{}, // unitId -> {stars, bestScore}
    streak: 0,
    lastPlayedDate: null,
    totalXP: 0,
    showTranslations: false,
    listeningScores: {}, // textId -> {best}
    speechSpeed: "slow", // "slow" or "normal"
    voiceName: null // preferred SpeechSynthesisVoice name, or null for auto-pick
  }, saved);
}
function saveState(){
  try{
    const toSave = Object.assign({}, state);
    delete toSave.unlockAll; // never persisted: parent mode resets when the page closes
    localStorage.setItem(STORAGE_KEY, JSON.stringify(toSave));
  }catch(e){}
}
let state = loadState();
state.unlockAll = false; // parent mode always starts off; lives only in memory for this page load

function todayStr(){
  return new Date().toISOString().slice(0,10);
}
function registerPlaySession(){
  const today = todayStr();
  if(state.lastPlayedDate === today) return;
  const yesterday = new Date(Date.now()-86400000).toISOString().slice(0,10);
  if(state.lastPlayedDate === yesterday){
    state.streak += 1;
  } else {
    state.streak = 1;
  }
  state.lastPlayedDate = today;
  saveState();
}

   ============================================================ */
const app = document.getElementById("app");
let session = null; // active exercise session

function render(){
  const hash = location.hash.replace("#","");
  if(hash.startsWith("play-")){
    const unitId = hash.replace("play-","");
    const unit = UNITS.find(u=>u.id===unitId);
    if(unit) return renderPlay(unit);
  }
  if(hash === "listening"){ return renderListeningMenu(); }
  if(hash.startsWith("listen-")){
    const textId = hash.replace("listen-","");
    const text = LISTENING_TEXTS.find(t=>t.id===textId);
    if(text) return renderListeningPlay(text);
  }
  renderHome();
}
window.addEventListener("hashchange", render);

function go(hash){ location.hash = hash; }

/* ---------- HOME ---------- */
function unitStars(unit){
  const rec = state.completedUnits[unit.id];
  if(!rec) return 0;
  return rec.stars || 0;
}

function renderHome(){
  session = null;
  const totalStars = UNITS.reduce((s,u)=>s+unitStars(u),0);
  const maxStars = UNITS.length*3;

  const unitsHtml = UNITS.map((u,i)=>{
    const stars = unitStars(u);
    const done = stars>0;
    const prevDone = i===0 || unitStars(UNITS[i-1])>0;
    const locked = !done && !prevDone && i>0 && !state.unlockAll;
    const cls = done ? "done" : (locked ? "locked" : "current");
    const starsHtml = done ? `<span style="color:var(--gold);font-size:12px;">${"★".repeat(stars)}${"☆".repeat(3-stars)}</span>` : "";
    return `
      <div class="unit-card ${cls}" data-unit="${u.id}" ${locked?"":''}>
        <div class="unit-badge">${u.icon}</div>
        <div class="unit-info">
          <h3>${u.title}</h3>
          <p>${u.blurb} ${starsHtml}</p>
        </div>
        <div class="unit-chevron">${locked?"🔒":"›"}</div>
      </div>`;
  }).join("");

  const parentActive = !!state.unlockAll;
  const parentBanner = parentActive ? `
    <div class="parent-banner">
      <span>👀 Mode parent actif : toutes les missions sont déverrouillées pour tester.</span>
      <button id="btn-parent-off">Désactiver</button>
    </div>` : "";

  const translationsOn = !!state.showTranslations;
  const translationBanner = `
    <div class="parent-banner" style="${translationsOn?'':'background:var(--surface-2);border-style:solid;border-color:var(--border);color:var(--text-muted);'}">
      <span>${translationsOn ? '🇫🇷 Traductions affichées : les phrases et réponses apparaissent aussi en français.' : '🇫🇷 Traductions masquées : entraîne-toi en anglais seul.'}</span>
      <button id="btn-translations-toggle">${translationsOn ? 'Désactiver' : 'Activer'}</button>
    </div>`;

  app.innerHTML = `
    <div class="home-toprow">
      <button class="pill-btn" id="btn-howto">❓ Mode d'emploi</button>
      <button class="pill-btn ${parentActive?'active':''}" id="btn-parent-toggle">🔓 Mode parent</button>
    </div>
    <div class="hero">
      <div class="avatar">🐿️</div>
      <div>
        <h1>Friendsly</h1>
        <p>My Friends and I — English Unit 1</p>
      </div>
    </div>
    ${parentBanner}
    ${translationBanner}
    <div style="display:flex;gap:10px;">
      <div class="stat-pill" style="flex:1;">
        <span class="num">🔥 ${state.streak}</span>
        <span class="lbl">Day streak</span>
      </div>
      <div class="stat-pill" style="flex:1;">
        <span class="num">⭐ ${totalStars}/${maxStars}</span>
        <span class="lbl">Stars</span>
      </div>
    </div>
    <div class="unit-card current" id="card-listening" style="background:linear-gradient(155deg,var(--accent-soft),var(--surface));">
      <div class="unit-badge">🎧</div>
      <div class="unit-info">
        <h3>Listening</h3>
        <p>Écoute un texte lu à voix haute et réponds aux questions</p>
      </div>
      <div class="unit-chevron">›</div>
    </div>
    <div class="section-title">Choisis une mission</div>
    <div class="path">${unitsHtml}</div>
  `;

  app.querySelectorAll(".unit-card:not(#card-listening)").forEach(card=>{
    card.addEventListener("click", ()=>{
      if(card.classList.contains("locked")) return;
      go("play-"+card.dataset.unit);
    });
  });
  document.getElementById("card-listening").addEventListener("click", ()=> go("listening"));

  document.getElementById("btn-howto").addEventListener("click", showHowToModal);
  document.getElementById("btn-parent-toggle").addEventListener("click", ()=>{
    if(state.unlockAll){
      state.unlockAll = false;
      renderHome();
    } else {
      showParentModal();
    }
  });
  const parentOffBtn = document.getElementById("btn-parent-off");
  if(parentOffBtn){
    parentOffBtn.addEventListener("click", (e)=>{
      e.stopPropagation();
      state.unlockAll = false;
      saveState();
      renderHome();
    });
  }
  document.getElementById("btn-translations-toggle").addEventListener("click", (e)=>{
    e.stopPropagation();
    state.showTranslations = !state.showTranslations;
    saveState();
    renderHome();
  });
}

/* ---------- LISTENING ---------- */
const SPEECH_RATES = { slow: 0.62, normal: 0.8 };

let cachedVoices = [];
function loadVoicesOnce(){
  try{
    if(!('speechSynthesis' in window)) return;
    cachedVoices = window.speechSynthesis.getVoices() || [];
  }catch(e){}
}
if(typeof window!=="undefined" && 'speechSynthesis' in window){
  loadVoicesOnce();
  window.speechSynthesis.onvoiceschanged = loadVoicesOnce;
}

/* Ranks English voices so the clearest ones (labelled "Enhanced"/"Premium"/
   "Natural" on iOS/macOS, or Google's higher-quality voices elsewhere) come
   first, instead of the terse default voice the OS picks otherwise. */
function englishVoices(){
  return cachedVoices.filter(v=> (v.lang||"").toLowerCase().startsWith("en"));
}
function bestVoiceScore(v){
  const name = (v.name||"").toLowerCase();
  let score = 0;
  if(/enhanced|premium|natural|neural/.test(name)) score += 10;
  if(/siri/.test(name)) score += 6;
  if(/google/.test(name)) score += 4;
  if((v.lang||"").toLowerCase()==="en-gb") score += 2;
  if(v.localService) score += 1;
  return score;
}
function pickBestVoice(){
  const voices = englishVoices();
  if(voices.length===0) return null;
  const preferredName = state.voiceName;
  if(preferredName){
    const match = voices.find(v=>v.name===preferredName);
    if(match) return match;
  }
  return voices.slice().sort((a,b)=> bestVoiceScore(b)-bestVoiceScore(a))[0];
}

function speak(text, lang){
  try{
    if(!('speechSynthesis' in window)) return false;
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    const voice = pickBestVoice();
    if(voice){ utter.voice = voice; utter.lang = voice.lang; }
    else { utter.lang = lang || "en-GB"; }
    utter.rate = SPEECH_RATES[state.speechSpeed] || SPEECH_RATES.slow;
    utter.pitch = 1;
    window.speechSynthesis.speak(utter);
    return true;
  }catch(e){ return false; }
}
function stopSpeaking(){
  try{ if('speechSynthesis' in window) window.speechSynthesis.cancel(); }catch(e){}
}

function renderListeningPlay(textItem){
  if(!session || session.kind!=="listening" || session.textId!==textItem.id){
    session = {

  if(session.idx >= session.total){ return renderListeningResult(textItem); }

  const item = session.questions ? session.questions[session.idx] : textItem.questions[session.idx];
  const progressPct = Math.round((session.idx/session.total)*100);

  const speedIsSlow = state.speechSpeed !== "normal";
  const voiceChoices = englishVoices();
  const activeVoice = pickBestVoice();
  const voicePickerHtml = voiceChoices.length > 1 ? `

      </div>

  document.getElementById("btn-exit").addEventListener("click", ()=>{ stopSpeaking(); go("listening"); });
  document.getElementById("btn-play").addEventListener("click", ()=>{

  });

  if(voiceSelect){
    voiceSelect.addEventListener("change", ()=>{
      state.voiceName = voiceSelect.value; saveState();
    });
  }

  renderListeningExercise(item, textItem);
}

/* ---------- PLAY SESSION ---------- */
const HEARTS_START = 5;
const ROUND_SIZE_MAX = 10;

function renderPlay(unit){
  if(!session || session.unitId!==unit.id){
    const pool = shuffle(unit.exercises).slice(0, Math.min(ROUND_SIZE_MAX, unit.exercises.length));
    session = {
      unitId: unit.id,
      queue: pool,
      idx: 0,
      hearts: HEARTS_START,
      correctCount: 0,
      total: pool.length,
      answered: false,
      matchState: null
    };
  }
  if(session.hearts<=0){ return renderFail(unit); }
  if(session.idx >= session.queue.length){ return renderResult(unit); }

  const item = session.queue[session.idx];
  const progressPct = Math.round((session.idx/session.total)*100);

  app.innerHTML = `
    <div class="topbar">
      <button class="iconbtn" id="btn-exit">✕</button>
      <div class="progress-track"><div class="progress-fill" style="width:${progressPct}%"></div></div>
      <div class="stat hearts">♥ ${session.hearts}</div>
    </div>
    <div class="card" id="exercise-card"></div>
    <div class="bottom-bar" id="bottom-bar"></div>
  `;
  document.getElementById("btn-exit").addEventListener("click", ()=>{
    if(confirmless("Quit this mission? Your progress in this round will be lost.")) go("");
  });

  renderExercise(item, unit);
}

function confirmless(msg){
  // confirm() is inert in this environment; just proceed (exit always allowed).
  return true;
}

function renderExercise(item, unit){
  const cardEl = document.getElementById("exercise-card");
  const barEl = document.getElementById("bottom-bar");
  session.answered = false;

  if(item.type === "mcq"){
    const trOn = !!state.showTranslations;
    const frHint = (trOn && item.fr) ? `<div class="translation-hint"><span class="flag">🇫🇷</span><span>${item.fr}</span></div>` : "";
    cardEl.innerHTML = `
      <div class="prompt-kicker">${unit.title}</div>
      <p class="prompt">${item.prompt}</p>
      <p class="prompt-sub">${item.sub}</p>
      ${frHint}
      <div class="choices">
        ${item.options.map((opt,i)=>{
          const optFr = (trOn && item.optionsFr && item.optionsFr[opt]) ? `<span class="opt-fr">🇫🇷 ${item.optionsFr[opt]}</span>` : "";
          return `<button class="choice" data-opt="${escapeAttr(opt)}">${opt}${optFr}</button>`;
        }).join("")}
      </div>
    `;
    barEl.innerHTML = `<button class="btn btn-primary" id="btn-check" disabled>Check</button>`;
    let selected = null;
    cardEl.querySelectorAll(".choice").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        if(session.answered) return;
        cardEl.querySelectorAll(".choice").forEach(b=>b.classList.remove("selected"));
        btn.classList.add("selected");
        selected = btn.dataset.opt;
        document.getElementById("btn-check").disabled = false;
      });
    });
    document.getElementById("btn-check").addEventListener("click", ()=>{
      if(!selected || session.answered) return;
      const isCorrect = selected === item.correct;
      session.answered = true;
      cardEl.querySelectorAll(".choice").forEach(b=>{
        b.disabled = true;
        if(b.dataset.opt === item.correct) b.classList.add("correct");
        else if(b.dataset.opt === selected) b.classList.add("wrong");
      });
      showFeedback(isCorrect, item, unit);
    });

  } else if(item.type === "typed"){
    const trOn = !!state.showTranslations;
    const frHint = (trOn && item.fr) ? `<div class="translation-hint"><span class="flag">🇫🇷</span><span>${item.fr}</span></div>` : "";
    cardEl.innerHTML = `
      <div class="prompt-kicker">${unit.title}</div>
      <p class="prompt">${item.prompt}</p>
      <p class="prompt-sub">${item.sub}</p>
      ${frHint}
      <input type="text" class="blank-input" id="typed-input" placeholder="Type your answer..." autocomplete="off" autocapitalize="off" spellcheck="false">
    `;
    barEl.innerHTML = `<button class="btn btn-primary" id="btn-check" disabled>Check</button>`;
    const input = document.getElementById("typed-input");
    input.addEventListener("input", ()=>{
      document.getElementById("btn-check").disabled = input.value.trim().length===0;
    });
    input.addEventListener("keydown", (e)=>{
      if(e.key==="Enter" && !document.getElementById("btn-check").disabled) document.getElementById("btn-check").click();
    });
    setTimeout(()=>input.focus(), 50);
    document.getElementById("btn-check").addEventListener("click", ()=>{
      if(session.answered) return;
      session.answered = true;
      const val = input.value.trim().toLowerCase().replace(/\s+/g," ");
      const isCorrect = item.answers.some(a=>a.toLowerCase()===val);
      input.disabled = true;
      input.classList.add(isCorrect?"correct":"wrong");
      showFeedback(isCorrect, item, unit);
    });

  } else if(item.type === "match"){
    const trOn = !!state.showTranslations;
    const leftItems = shuffle(item.pairs.map((p,i)=>({id:"L"+i, text:p.left, fr:p.leftFr||"", pairId:i})));
    const rightItems = shuffle(item.pairs.map((p,i)=>({id:"R"+i, text:p.right, fr:p.rightFr||"", pairId:i})));
    session.matchState = { matched: new Set(), selectedLeft:null, selectedRight:null, mistakes:0, pairsCount:item.pairs.length };

    const frHint = (trOn && item.fr) ? `<div class="translation-hint"><span class="flag">🇫🇷</span><span>${item.fr}</span></div>` : "";

    cardEl.innerHTML = `
      <div class="prompt-kicker">${unit.title}</div>
      <p class="prompt">${item.prompt}</p>
      <p class="prompt-sub">Tap one item on each side to match them.</p>
      ${frHint}
      <div class="match-cols">
        <div class="match-col" id="col-left">
          ${leftItems.map(li=>`<button class="match-item" data-id="${li.id}" data-pair="${li.pairId}">${li.text}${(trOn && li.fr)?`<span class="item-fr">🇫🇷 ${li.fr}</span>`:""}</button>`).join("")}
        </div>
        <div class="match-col" id="col-right">
          ${rightItems.map(ri=>`<button class="match-item" data-id="${ri.id}" data-pair="${ri.pairId}">${ri.text}${(trOn && ri.fr)?`<span class="item-fr">🇫🇷 ${ri.fr}</span>`:""}</button>`).join("")}
        </div>
      </div>
    `;
    barEl.innerHTML = `<button class="btn btn-primary" id="btn-continue" disabled>Continue</button>`;

    function tryMatch(){
      const ms = session.matchState;
      if(ms.selectedLeft==null || ms.selectedRight==null) return;
      const leftBtn = cardEl.querySelector(`.match-item[data-id="${ms.selectedLeft}"]`);
      const rightBtn = cardEl.querySelector(`.match-item[data-id="${ms.selectedRight}"]`);
      const leftPair = leftBtn.dataset.pair;
      const rightPair = rightBtn.dataset.pair;
      if(leftPair === rightPair){
        leftBtn.classList.remove("selected");
        rightBtn.classList.remove("selected");
        leftBtn.classList.add("matched");
        rightBtn.classList.add("matched");
        ms.matched.add(leftPair);
        ms.selectedLeft = null; ms.selectedRight = null;
        if(ms.matched.size === ms.pairsCount){
          document.getElementById("btn-continue").disabled = false;
          const isCorrect = ms.mistakes===0;
          session.answered = true;
          showFeedback(isCorrect, item, unit, true);
        }
      } else {
        ms.mistakes++;
        leftBtn.classList.add("wrongflash");
        rightBtn.classList.add("wrongflash");
        setTimeout(()=>{
          leftBtn.classList.remove("selected","wrongflash");
          rightBtn.classList.remove("selected","wrongflash");
        }, 450);
        ms.selectedLeft = null; ms.selectedRight = null;
      }
    }

    cardEl.querySelectorAll("#col-left .match-item").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const ms = session.matchState;
        if(btn.classList.contains("matched")) return;
        cardEl.querySelectorAll("#col-left .match-item").forEach(b=>b.classList.remove("selected"));
        btn.classList.add("selected");
        ms.selectedLeft = btn.dataset.id;
        tryMatch();
      });
    });
    cardEl.querySelectorAll("#col-right .match-item").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const ms = session.matchState;
        if(btn.classList.contains("matched")) return;
        cardEl.querySelectorAll("#col-right .match-item").forEach(b=>b.classList.remove("selected"));
        btn.classList.add("selected");
        ms.selectedRight = btn.dataset.id;
        tryMatch();
      });
    });
    document.getElementById("btn-continue").addEventListener("click", ()=> advance());
  }
}

function escapeAttr(s){ return String(s).replace(/"/g,"&quot;"); }

function showFeedback(isCorrect, item, unit, isMatch){
  const barEl = document.getElementById("bottom-bar");
  if(isCorrect){
    session.correctCount++;
  } else {
    session.hearts = Math.max(0, session.hearts-1);
  }
  const panelClass = isCorrect ? "ok" : "ko";
  const emoji = isCorrect ? "🎉" : "😿";
  const title = isCorrect ? pickPraise() : "Not quite!";
  const trOn = !!state.showTranslations;
  let text = "";
  if(!isCorrect){
    if(item.type==="mcq"){
      const correctFr = (trOn && item.optionsFr && item.optionsFr[item.correct]) ? ` <span style="opacity:.8;">(🇫🇷 ${item.optionsFr[item.correct]})</span>` : "";
      text = `Correct answer: <strong>${item.correct}</strong>${correctFr}.`;
    } else if(item.type==="typed"){
      text = `Correct answer: <strong>${item.answers[0]}</strong>.`;
    } else {
      text = "Some pairs were wrong — check them again next time.";
    }
  }
  if(trOn && item.fr && item.type!=="match") text += (text?" ":"") + `<span style="display:block;margin-top:4px;">🇫🇷 ${item.fr}</span>`;
  if(item.explain) text += (text?" ":"") + item.explain;

  const heartsLostNote = (!isCorrect && session.hearts===0) ? `<p class="hearts-lost-note">Out of hearts...</p>` : "";

  barEl.innerHTML = `
    <div class="feedback-panel ${panelClass}">
      <div class="emoji">${emoji}</div>
      <div>
        <p class="fb-title">${title}</p>
        <p class="fb-text">${text}</p>
      </div>
    </div>
    ${heartsLostNote}
    <button class="btn ${isCorrect?'btn-success':'btn-error'}" id="btn-continue">Continue</button>
  `;
  document.getElementById("btn-continue").addEventListener("click", ()=> advance());
}

function pickPraise(){
  return pick(["Nicely done!","Great job!","Excellent!","You've got it!","Perfect!"],1)[0];
}

function advance(){
  session.idx++;
  const unit = UNITS.find(u=>u.id===session.unitId);
  if(session.hearts<=0){ renderFail(unit); return; }
  render();
}

    </div>
    <div class="bottom-bar">
      <button class="btn btn-primary" id="btn-retry">Try again</button>
      <div style="height:8px;"></div>
      <button class="btn btn-ghost" id="btn-home">Back to missions</button>
    </div>
  `;
  document.getElementById("btn-exit").addEventListener("click", ()=>go(""));
  document.getElementById("btn-home").addEventListener("click", ()=>go(""));
  document.getElementById("btn-retry").addEventListener("click", ()=>{ session=null; go("play-"+unit.id); });
}

function renderResult(unit){
  const pct = session.total>0 ? session.correctCount/session.total : 0;
  let stars = 1;
  if(pct>=0.95) stars = 3;
  else if(pct>=0.75) stars = 2;
  const prevStars = unitStars(unit);
  if(stars > prevStars){
    state.completedUnits[unit.id] = { stars, bestScore: session.correctCount };
  } else if(!state.completedUnits[unit.id]){
    state.completedUnits[unit.id] = { stars, bestScore: session.correctCount };
  }
  state.totalXP += session.correctCount * 10;
  registerPlaySession();
  saveState();

  const starsHtml = `<div style="font-size:40px;letter-spacing:6px;">${"★".repeat(stars)}${"☆".repeat(3-stars)}</div>`;

  app.innerHTML = `
    <div class="topbar">
      <button class="iconbtn" id="btn-exit">✕</button>
      <div class="progress-track"><div class="progress-fill" style="width:100%;"></div></div>
      <div class="stat hearts">♥ ${session.hearts}</div>
    </div>
    <div class="result-wrap">
      <div class="result-emoji">🏆</div>
      <h2>Mission complete!</h2>
      ${starsHtml}
      <div class="result-stats">
        <div class="stat-pill">
          <span class="num">${session.correctCount}/${session.total}</span>
          <span class="lbl">Correct</span>
        </div>
        <div class="stat-pill">
          <span class="num">+${session.correctCount*10}</span>
          <span class="lbl">XP</span>
        </div>
        <div class="stat-pill">
          <span class="num">🔥 ${state.streak}</span>
          <span class="lbl">Streak</span>
        </div>
      </div>
    </div>
    <div class="bottom-bar">
      <button class="btn btn-primary" id="btn-continue-home">Continue</button>
    </div>
  `;
  document.getElementById("btn-exit").addEventListener("click", ()=>go(""));
  document.getElementById("btn-continue-home").addEventListener("click", ()=>{ session=null; go(""); });
}

/* ============================================================
   BOOT
   ============================================================ */
function start(hotData){
  if(hotData && hotData.state) state = Object.assign(state, hotData.state);
  render();
}
if(window.claude && window.claude.hot){
  window.claude.hot.snapshot(()=>({ state }));
  window.claude.hot.ready ? window.claude.hot.ready(start) : start(window.claude.hot.data||{});
} else {
  start({});
}

})();
</script>
