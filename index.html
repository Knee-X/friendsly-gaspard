<title>Friendsly</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7F5FF;
  --surface:#FFFFFF;
  --surface-2:#F0ECFF;
  --border:#E3DCFF;
  --text:#1B1035;
  --text-muted:#6B6180;
  --accent:#5B3DF5;
  --accent-dark:#4526E0;
  --accent-soft:#EDE8FF;
  --success:#1FAE5C;
  --success-soft:#E3F9EC;
  --error:#F0355A;
  --error-soft:#FEE7EC;
  --gold:#F5A623;
  --shadow: 0 2px 0 var(--border);
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#150E28;
    --surface:#201735;
    --surface-2:#271D40;
    --border:#382C57;
    --text:#F3EFFF;
    --text-muted:#B3A6D6;
    --accent:#8B7CFA;
    --accent-dark:#A497FF;
    --accent-soft:#2E2350;
    --success:#3DDC84;
    --success-soft:#173327;
    --error:#FF5C7C;
    --error-soft:#3A1826;
    --gold:#F6BB4E;
    --shadow: 0 2px 0 var(--border);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#150E28;
  --surface:#201735;
  --surface-2:#271D40;
  --border:#382C57;
  --text:#F3EFFF;
  --text-muted:#B3A6D6;
  --accent:#8B7CFA;
  --accent-dark:#A497FF;
  --accent-soft:#2E2350;
  --success:#3DDC84;
  --success-soft:#173327;
  --error:#FF5C7C;
  --error-soft:#3A1826;
  --gold:#F6BB4E;
  --shadow: 0 2px 0 var(--border);
  color-scheme: dark;
}

*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:'Inter',system-ui,sans-serif;
  padding-inline:16px;
  padding-block:20px;
  display:flex;
  justify-content:center;
}
h1,h2,h3,.display{font-family:'Baloo 2',system-ui,sans-serif;text-wrap:balance;}

#app{
  width:100%;
  max-width:480px;
  display:flex;
  flex-direction:column;
  gap:16px;
}

/* ---------- Top bar ---------- */
.topbar{
  display:flex;
  align-items:center;
  gap:12px;
  min-height:36px;
}
.iconbtn{
  border:none;
  background:none;
  color:var(--text-muted);
  font-size:22px;
  cursor:pointer;
  padding:4px 8px;
  border-radius:10px;
  line-height:1;
}
.iconbtn:hover{background:var(--surface-2);}
.progress-track{
  flex:1;
  height:14px;
  background:var(--surface-2);
  border-radius:999px;
  overflow:hidden;
  border:1px solid var(--border);
}
.progress-fill{
  height:100%;
  background:var(--success);
  border-radius:999px;
  transition:width .35s ease;
  width:0%;
}
.stat{
  display:flex;
  align-items:center;
  gap:4px;
  font-weight:800;
  font-family:'Baloo 2',sans-serif;
  font-size:15px;
  white-space:nowrap;
}
.stat.hearts{color:var(--error);}
.stat.streak{color:var(--gold);}

/* ---------- Home screen ---------- */
.hero{
  background:linear-gradient(155deg,var(--accent) 0%, var(--accent-dark) 100%);
  color:#fff;
  border-radius:24px;
  padding:22px 20px;
  display:flex;
  align-items:center;
  gap:16px;
  box-shadow:0 6px 0 var(--accent-dark);
}
.hero .avatar{
  width:56px;height:56px;border-radius:16px;
  background:rgba(255,255,255,.18);
  display:flex;align-items:center;justify-content:center;
  font-size:30px;flex-shrink:0;
}
.hero h1{margin:0 0 2px;font-size:22px;color:#fff;}
.hero p{margin:0;font-size:13.5px;opacity:.9;}

.section-title{
  font-size:13px;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.06em;
  color:var(--text-muted);
  margin:4px 2px 0;
}

.path{
  display:flex;
  flex-direction:column;
  gap:12px;
}
.unit-card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:18px;
  padding:16px;
  display:flex;
  align-items:center;
  gap:14px;
  cursor:pointer;
  box-shadow:var(--shadow);
  position:relative;
  transition:transform .12s ease;
}
.unit-card:active{transform:scale(.98);}
.unit-card.locked{opacity:.55;cursor:not-allowed;}
.unit-badge{
  width:52px;height:52px;border-radius:14px;
  display:flex;align-items:center;justify-content:center;
  font-size:26px;flex-shrink:0;
  background:var(--accent-soft);
  color:var(--accent);
  border:2px solid var(--border);
}
.unit-card.done .unit-badge{background:var(--success-soft);color:var(--success);border-color:var(--success);}
.unit-card.current .unit-badge{background:var(--accent);color:#fff;border-color:var(--accent-dark);}
.unit-info{flex:1;min-width:0;}
.unit-info h3{margin:0 0 3px;font-size:16.5px;}
.unit-info p{margin:0;font-size:12.5px;color:var(--text-muted);}
.unit-chevron{color:var(--text-muted);font-size:20px;}
.mini-progress{
  position:absolute;left:16px;right:16px;bottom:8px;
  height:5px;background:var(--surface-2);border-radius:999px;overflow:hidden;
}
.mini-progress i{display:block;height:100%;background:var(--success);}

/* ---------- Exercise screen ---------- */
.card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:20px;
  padding:20px;
  box-shadow:var(--shadow);
}
.prompt-kicker{
  font-size:12px;font-weight:700;color:var(--accent);
  text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px;
}
.prompt{font-size:19px;font-weight:700;margin:0 0 4px;font-family:'Baloo 2',sans-serif;}
.prompt-sub{font-size:14px;color:var(--text-muted);margin:0 0 16px;}

.choices{display:flex;flex-direction:column;gap:10px;}
.choice{
  border:2px solid var(--border);
  background:var(--surface);
  color:var(--text);
  border-radius:14px;
  padding:13px 16px;
  font-size:15.5px;
  font-weight:600;
  text-align:left;
  cursor:pointer;
  font-family:inherit;
  transition:border-color .12s, background .12s, transform .08s;
}
.choice:hover{border-color:var(--accent);}
.choice:active{transform:scale(.985);}
.choice.selected{border-color:var(--accent);background:var(--accent-soft);}
.choice.correct{border-color:var(--success);background:var(--success-soft);color:var(--success);}
.choice.wrong{border-color:var(--error);background:var(--error-soft);color:var(--error);}
.choice[disabled]{cursor:default;}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

.match-cols{display:flex;gap:10px;}
.match-col{flex:1;display:flex;flex-direction:column;gap:8px;}
.match-item{
  border:2px solid var(--border);
  background:var(--surface);
  border-radius:12px;
  padding:11px 10px;
  font-size:14px;
  font-weight:600;
  text-align:center;
  cursor:pointer;
  min-height:44px;
  display:flex;align-items:center;justify-content:center;
}
.match-item.selected{border-color:var(--accent);background:var(--accent-soft);}
.match-item.matched{border-color:var(--success);background:var(--success-soft);color:var(--success);opacity:.7;cursor:default;}
.match-item.wrongflash{border-color:var(--error);background:var(--error-soft);}

.blank-input{
  width:100%;
  border:2px solid var(--border);
  border-radius:14px;
  padding:13px 16px;
  font-size:16px;
  font-family:inherit;
  background:var(--surface);
  color:var(--text);
  margin-bottom:4px;
}
.blank-input:focus{outline:none;border-color:var(--accent);}
.blank-input.correct{border-color:var(--success);background:var(--success-soft);}
.blank-input.wrong{border-color:var(--error);background:var(--error-soft);}

/* ---------- Bottom action bar ---------- */
.bottom-bar{
  position:sticky;
  bottom:0;
  padding-top:10px;
  padding-bottom:calc(6px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(var(--bg-fade,transparent), var(--bg) 30%);
}
.btn{
  width:100%;
  border:none;
  border-radius:16px;
  padding:15px 20px;
  font-size:16px;
  font-weight:800;
  font-family:'Baloo 2',sans-serif;
  cursor:pointer;
  letter-spacing:.02em;
}
.btn-primary{background:var(--accent);color:#fff;box-shadow:0 4px 0 var(--accent-dark);}
.btn-primary:active{box-shadow:0 1px 0 var(--accent-dark);transform:translateY(3px);}
.btn-primary:disabled{background:var(--surface-2);color:var(--text-muted);box-shadow:none;cursor:not-allowed;}
.btn-success{background:var(--success);color:#fff;box-shadow:0 4px 0 #158247;}
.btn-error{background:var(--error);color:#fff;box-shadow:0 4px 0 #b7203c;}
.btn-ghost{background:none;color:var(--accent);box-shadow:none;text-decoration:underline;padding:8px;}

.feedback-panel{
  border-radius:18px;
  padding:14px 16px;
  display:flex;
  align-items:flex-start;
  gap:12px;
  margin-bottom:10px;
}
.feedback-panel.ok{background:var(--success-soft);color:var(--success);}
.feedback-panel.ko{background:var(--error-soft);color:var(--error);}
.feedback-panel .emoji{font-size:24px;}
.feedback-panel .fb-title{font-family:'Baloo 2',sans-serif;font-weight:700;font-size:16px;margin:0 0 3px;}
.feedback-panel .fb-text{font-size:13.5px;margin:0;color:var(--text);opacity:.85;}

/* ---------- Result screen ---------- */
.result-wrap{text-align:center;padding:20px 6px;}
.result-emoji{font-size:64px;margin-bottom:6px;}
.result-stats{display:flex;justify-content:center;gap:10px;margin:18px 0;}
.stat-pill{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:14px;
  padding:12px 16px;
  min-width:84px;
}
.stat-pill .num{font-family:'Baloo 2',sans-serif;font-size:22px;font-weight:800;display:block;}
.stat-pill .lbl{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em;}

.hidden{display:none!important;}

.hearts-lost-note{font-size:12px;color:var(--text-muted);text-align:center;margin-top:2px;}

/* ---------- Home top row & modal ---------- */
.home-toprow{display:flex;justify-content:flex-end;gap:8px;}
.pill-btn{
  border:1px solid var(--border);
  background:var(--surface);
  color:var(--text);
  border-radius:999px;
  padding:7px 13px;
  font-size:12.5px;
  font-weight:700;
  font-family:'Inter',sans-serif;
  cursor:pointer;
  display:flex;
  align-items:center;
  gap:5px;
}
.pill-btn:hover{border-color:var(--accent);color:var(--accent);}
.pill-btn.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);}

.parent-banner{
  background:var(--accent-soft);
  border:1px dashed var(--accent);
  border-radius:14px;
  padding:10px 14px;
  font-size:12.5px;
  color:var(--accent-dark);
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}
.parent-banner button{
  border:none;background:none;color:var(--accent-dark);
  font-weight:700;text-decoration:underline;cursor:pointer;
  font-size:12.5px;padding:2px;white-space:nowrap;
  font-family:inherit;
}

.modal-overlay{
  position:fixed;inset:0;
  background:rgba(20,10,40,.45);
  display:flex;align-items:flex-end;justify-content:center;
  z-index:50;
  padding:0;
}
@media (min-width:520px){
  .modal-overlay{align-items:center;}
}
.modal-sheet{
  background:var(--surface);
  width:100%;max-width:480px;
  border-radius:22px 22px 0 0;
  padding:22px 20px calc(20px + env(safe-area-inset-bottom,0px));
  max-height:85vh;
  overflow-y:auto;
}
@media (min-width:520px){
  .modal-sheet{border-radius:22px;max-height:80vh;}
}
.modal-sheet h2{margin:0 0 4px;font-size:21px;}
.modal-sheet .modal-sub{color:var(--text-muted);font-size:13.5px;margin:0 0 16px;}
.modal-sheet h3{font-size:14.5px;margin:18px 0 8px;}
.modal-sheet ol,.modal-sheet ul{margin:0;padding-left:20px;font-size:14px;line-height:1.55;}
.modal-sheet li{margin-bottom:6px;}
.modal-sheet .legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px;}
.legend-chip{
  display:flex;align-items:center;gap:6px;
  background:var(--surface-2);border-radius:999px;
  padding:6px 12px;font-size:12.5px;font-weight:600;
}
.modal-close-x{
  position:absolute;top:14px;right:14px;
  border:none;background:var(--surface-2);color:var(--text-muted);
  width:32px;height:32px;border-radius:999px;font-size:16px;cursor:pointer;
}
.modal-sheet{position:relative;}

/* ---------- Translation toggle & hints ---------- */
.translation-hint{
  margin-top:10px;
  background:var(--surface-2);
  border-left:3px solid var(--accent);
  border-radius:10px;
  padding:10px 12px;
  font-size:13.5px;
  color:var(--text);
  display:flex;
  gap:8px;
  align-items:flex-start;
}
.translation-hint .flag{flex-shrink:0;}
.match-item .item-fr{
  display:block;
  font-size:10.5px;
  font-weight:500;
  color:var(--text-muted);
  margin-top:2px;
}
.choice .opt-fr{
  display:block;
  font-size:11.5px;
  font-weight:500;
  color:var(--text-muted);
  margin-top:2px;
}
</style>

<script>
(function(){
"use strict";

/* ============================================================
   CONTENT — English Unit 1, "My Friends and I" (Gaspard, 4e/2e degré)
   Sourced from: personality adjectives, relationships vocab,
   friendship idioms, family vocab, present perfect vs past simple,
   for/since, expressing purpose (to / in order to / so as to).
   ============================================================ */

const UNITS = [
  {
    id: "personality",
    title: "Personality",
    icon: "🧠",
    blurb: "Adjectives to describe someone's character",
    exercises: buildPersonalityExercises()
  },
  {
    id: "opposites",
    title: "Opposites",
    icon: "⚖️",
    blurb: "Positive & negative character traits",
    exercises: buildOppositesExercises()
  },
  {
    id: "friends-vocab",
    title: "Friends & Relationships",
    icon: "🤝",
    blurb: "BFF, mate, acquaintance... and phrases",
    exercises: buildFriendsExercises()
  },
  {
    id: "idioms",
    title: "Friendship Idioms",
    icon: "💬",
    blurb: "Bury the hatchet, see eye to eye...",
    exercises: buildIdiomsExercises()
  },
  {
    id: "family",
    title: "Family",
    icon: "👪",
    blurb: "Widow, elder, twins, in-laws...",
    exercises: buildFamilyExercises()
  },
  {
    id: "grammar-tenses",
    title: "Grammar: Present Perfect vs Past Simple",
    icon: "⏳",
    blurb: "Choose the right tense",
    exercises: buildTenseExercises()
  },
  {
    id: "grammar-forsince",
    title: "Grammar: FOR / SINCE",
    icon: "🕰️",
    blurb: "Duration vs starting point",
    exercises: buildForSinceExercises()
  },
  {
    id: "grammar-purpose",
    title: "Grammar: Expressing Purpose",
    icon: "🎯",
    blurb: "to / in order to / so as to (never 'for + V')",
    exercises: buildPurposeExercises()
  }
];

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function pick(arr,n){ return shuffle(arr).slice(0,n); }
function mcq(prompt, sub, correct, distractors, opts){
  opts = opts || {};
  return {
    type:"mcq", prompt, sub, correct,
    options: shuffle([correct].concat(distractors)),
    explain: opts.explain || "",
    fr: opts.fr || null,          // French translation of the prompt/sentence
    optionsFr: opts.optionsFr || null // map: english option -> French translation
  };
}
function typed(prompt, sub, answers, opts){
  opts = opts || {};
  return { type:"typed", prompt, sub, answers: Array.isArray(answers)?answers:[answers], explain: opts.explain||"", fr: opts.fr || null };
}
function match(prompt, pairs, opts){
  opts = opts || {};
  // pairs: [{left, right, leftFr?, rightFr?}]
  return { type:"match", prompt, pairs, explain: opts.explain||"", fr: opts.fr || null };
}

/* ---------- 1. Personality adjectives (meaning matching) ---------- */
function buildPersonalityExercises(){
  // [english word, english definition, french translation of the word]
  const defs = [
    ["confident","feeling sure about yourself and your abilities","confiant(e)"],
    ["shy","not confident, especially about meeting new people","timide"],
    ["reliable","can be trusted to do what people expect you to do","fiable"],
    ["hard-working","putting a lot of effort into your work","travailleur/travailleuse"],
    ["patient","able to stay calm and not get angry when things take time","patient(e)"],
    ["impatient","not able to wait calmly; gets annoyed by delays","impatient(e)"],
    ["sensible","practical; doesn't do stupid things","raisonnable, sensé(e)"],
    ["creative","good at thinking of new ideas and using imagination","créatif/créative"],
    ["talented","has a natural ability for something","talentueux/talentueuse"],
    ["tolerant","able to accept differences in other people","tolérant(e)"],
    ["headstrong","determined to do things your own way","têtu(e)"],
    ["caring","kind and concerned about other people's feelings","attentionné(e)"]
  ];
  const ex = [];
  defs.forEach(([word,def,fr])=>{
    const distractors = pick(defs.filter(d=>d[0]!==word).map(d=>d[1]), 3);
    ex.push(mcq(`What does "${word}" mean?`, "Choose the correct definition.", def, distractors, {fr:`Que veut dire "${word}" (${fr}) ?`}));
  });
  // reverse direction: definition -> word
  pick(defs, 6).forEach(([word,def,fr])=>{
    const distractors = pick(defs.filter(d=>d[0]!==word).map(d=>d[0]), 3);
    ex.push(mcq(`"${def}"`, "Which adjective matches this definition?", word, distractors, {fr:`Quel adjectif correspond à : "${def}" ? (réponse : ${fr})`}));
  });
  // matching round
  const frMap = Object.fromEntries(defs.map(([w,d,fr])=>[w,fr]));
  ex.push(match("Match each adjective to its meaning.", pick(defs,4).map(([w,d,fr])=>({left:w,right:d,leftFr:fr})), {fr:"Associe chaque adjectif à sa définition."}));
  ex.push(match("Match each adjective to its meaning.", pick(defs,4).map(([w,d,fr])=>({left:w,right:d,leftFr:fr})), {fr:"Associe chaque adjectif à sa définition."}));
  // fill the blank
  const fillBank = [
    ["My sister can't wait for anything; she's so ____.", ["impatient"], "Ma sœur ne peut rien attendre ; elle est tellement ____ (impatiente)."],
    ["I get very ____ before exams; I need to relax more.", ["nervous","anxious"], "Je deviens très ____ (nerveux) avant les examens ; je dois me détendre davantage."],
    ["He's so ____, I could paint as well as your brother.", ["creative"], "Il est tellement ____ (créatif), je pourrais peindre aussi bien que ton frère."],
    ["Adeline hasn't done a thing since she's here. She's so ____.", ["lazy"], "Adeline n'a rien fait depuis qu'elle est là. Elle est tellement ____ (paresseuse)."],
    ["I always have a laugh with my cousin, he's got a great sense of ____.", ["humour"], "Je rigole toujours avec mon cousin, il a un grand sens de l'____ (humour)."],
    ["My younger sister understands new ideas so quickly; she's very ____.", ["clever","intelligent"], "Ma petite sœur comprend les nouvelles idées si vite ; elle est très ____ (intelligente)."],
    ["If Sarah says she'll do it, she'll do it. I ____ her completely.", ["trust"], "Si Sarah dit qu'elle le fera, elle le fera. Je lui fais totalement ____ (confiance)."],
    ["He failed his exams, but he isn't ____. He just didn't work.", ["stupid"], "Il a raté ses examens, mais il n'est pas ____ (stupide). Il n'a juste pas travaillé."]
  ];
  fillBank.forEach(([q,answers,fr])=> ex.push(typed(q,"Type the missing word.",answers,{fr})));
  return shuffle(ex);
}

/* ---------- 2. Opposites ---------- */
function buildOppositesExercises(){
  // [positive, negative, positive FR, negative FR]
  const pairs = [
    ["generous","mean","généreux/généreuse","radin(e), mesquin(e)"],
    ["honest","dishonest","honnête","malhonnête"],
    ["clever","stupid","intelligent(e)","stupide"],
    ["calm","nervous","calme","nerveux/nerveuse"],
    ["kind","unkind","gentil(le)","méchant(e)"],
    ["friendly","unfriendly","amical(e)","peu amical(e)"],
    ["pleasant","unpleasant","agréable","désagréable"],
    ["patient","impatient","patient(e)","impatient(e)"],
    ["reliable","unreliable","fiable","peu fiable"]
  ];
  const ex = [];
  pairs.forEach(([pos,neg,posFr,negFr])=>{
    const distractors = pick(pairs.filter(p=>p[1]!==neg).map(p=>p[1]),3);
    ex.push(mcq(`What is the opposite of "${pos}"?`,"Choose the correct word.", neg, distractors, {fr:`Quel est le contraire de "${pos}" (${posFr}) ? (réponse : ${negFr})`}));
  });
  ex.push(match("Match the positive adjective to its opposite.", pick(pairs,4).map(([p,n,pFr,nFr])=>({left:p,right:n,leftFr:pFr,rightFr:nFr})), {fr:"Associe chaque adjectif positif à son contraire."}));

/* ============================================================
   STATE
   ============================================================ */
const STORAGE_KEY = "friendsly_progress_v1";

function loadState(){
  let saved = {};
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) saved = JSON.parse(raw);
  }catch(e){}
  return Object.assign({
    completedUnits:{}, // unitId -> {stars, bestScore}
    streak: 0,
    lastPlayedDate: null,
    totalXP: 0,
    showTranslations: false
  }, saved);
}
function saveState(){
  try{
    const toSave = Object.assign({}, state);
    delete toSave.unlockAll; // never persisted: parent mode resets when the page closes
    localStorage.setItem(STORAGE_KEY, JSON.stringify(toSave));
  }catch(e){}
}
let state = loadState();
state.unlockAll = false; // parent mode always starts off; lives only in memory for this page load

function todayStr(){
  return new Date().toISOString().slice(0,10);
}
function registerPlaySession(){
  const today = todayStr();
  if(state.lastPlayedDate === today) return;
  const yesterday = new Date(Date.now()-86400000).toISOString().slice(0,10);
  if(state.lastPlayedDate === yesterday){
    state.streak += 1;
  } else {
    state.streak = 1;
  }
  state.lastPlayedDate = today;
  saveState();
}

/* ============================================================
   RENDER — router
   ============================================================ */
const app = document.getElementById("app");
let session = null; // active exercise session

function render(){
  const hash = location.hash.replace("#","");
  if(hash.startsWith("play-")){
    const unitId = hash.replace("play-","");
    const unit = UNITS.find(u=>u.id===unitId);
    if(unit) return renderPlay(unit);
  }
  renderHome();
}
window.addEventListener("hashchange", render);

function go(hash){ location.hash = hash; }

/* ---------- HOME ---------- */
function unitStars(unit){
  const rec = state.completedUnits[unit.id];
  if(!rec) return 0;
  return rec.stars || 0;
}

function renderHome(){
  session = null;
  const totalStars = UNITS.reduce((s,u)=>s+unitStars(u),0);
  const maxStars = UNITS.length*3;

  const unitsHtml = UNITS.map((u,i)=>{
    const stars = unitStars(u);
    const done = stars>0;
    const prevDone = i===0 || unitStars(UNITS[i-1])>0;
    const locked = !done && !prevDone && i>0 && !state.unlockAll;
    const cls = done ? "done" : (locked ? "locked" : "current");
    const starsHtml = done ? `<span style="color:var(--gold);font-size:12px;">${"★".repeat(stars)}${"☆".repeat(3-stars)}</span>` : "";
    return `
      <div class="unit-card ${cls}" data-unit="${u.id}" ${locked?"":''}>
        <div class="unit-badge">${u.icon}</div>
        <div class="unit-info">
          <h3>${u.title}</h3>
          <p>${u.blurb} ${starsHtml}</p>
        </div>
        <div class="unit-chevron">${locked?"🔒":"›"}</div>
      </div>`;
  }).join("");

  const parentActive = !!state.unlockAll;
  const parentBanner = parentActive ? `
    <div class="parent-banner">
      <span>👀 Mode parent actif : toutes les missions sont déverrouillées pour tester.</span>
      <button id="btn-parent-off">Désactiver</button>
    </div>` : "";

  const translationsOn = !!state.showTranslations;
  const translationBanner = `
    <div class="parent-banner" style="${translationsOn?'':'background:var(--surface-2);border-style:solid;border-color:var(--border);color:var(--text-muted);'}">
      <span>${translationsOn ? '🇫🇷 Traductions affichées : les phrases et réponses apparaissent aussi en français.' : '🇫🇷 Traductions masquées : entraîne-toi en anglais seul.'}</span>
      <button id="btn-translations-toggle">${translationsOn ? 'Désactiver' : 'Activer'}</button>
    </div>`;

  app.innerHTML = `
    <div class="home-toprow">
      <button class="pill-btn" id="btn-howto">❓ Mode d'emploi</button>
      <button class="pill-btn ${parentActive?'active':''}" id="btn-parent-toggle">🔓 Mode parent</button>
    </div>
    <div class="hero">
      <div class="avatar">🐿️</div>
      <div>
        <h1>Friendsly</h1>
        <p>My Friends and I — English Unit 1</p>
      </div>
    </div>
    ${parentBanner}
    ${translationBanner}
    <div style="display:flex;gap:10px;">
      <div class="stat-pill" style="flex:1;">
        <span class="num">🔥 ${state.streak}</span>
        <span class="lbl">Day streak</span>
      </div>
      <div class="stat-pill" style="flex:1;">
        <span class="num">⭐ ${totalStars}/${maxStars}</span>
        <span class="lbl">Stars</span>
      </div>
    </div>
    <div class="section-title">Choisis une mission</div>
    <div class="path">${unitsHtml}</div>
  `;

  app.querySelectorAll(".unit-card").forEach(card=>{
    card.addEventListener("click", ()=>{
      if(card.classList.contains("locked")) return;
      go("play-"+card.dataset.unit);
    });
  });

  document.getElementById("btn-howto").addEventListener("click", showHowToModal);
  document.getElementById("btn-parent-toggle").addEventListener("click", ()=>{
    if(state.unlockAll){
      state.unlockAll = false;
      renderHome();
    } else {
      showParentModal();
    }
  });
  const parentOffBtn = document.getElementById("btn-parent-off");
  if(parentOffBtn){
    parentOffBtn.addEventListener("click", (e)=>{
      e.stopPropagation();
      state.unlockAll = false;
      saveState();
      renderHome();
    });
  }
  document.getElementById("btn-translations-toggle").addEventListener("click", (e)=>{
    e.stopPropagation();
    state.showTranslations = !state.showTranslations;
    saveState();
    renderHome();
  });
}

  overlay.addEventListener("click", (e)=>{ if(e.target===overlay) overlay.remove(); });
  document.body.appendChild(overlay);
  const closeBtn = overlay.querySelector(".modal-close-x");
  if(closeBtn) closeBtn.addEventListener("click", ()=> overlay.remove());
  return overlay;
}

    <h3>5. 🇫🇷 Traductions</h3>
    <p style="font-size:14px;margin:0;">Active le bouton "Traductions" sur l'accueil pour voir les phrases et réponses en français pendant que tu t'entraînes. Conseil : entraîne-toi d'abord avec les traductions activées, puis désactive-les et refais la même mission sans aide pour vérifier que tu as bien retenu !</p>
  `);
}

function showParentModal(){
  openModal(`
    <button class="modal-close-x" aria-label="Fermer">✕</button>
    <h2>🔓 Mode parent</h2>
    <p class="modal-sub">Active ce mode pour tester toutes les missions librement, sans devoir les débloquer dans l'ordre.</p>
    <ul>
      <li>Toutes les missions deviennent accessibles immédiatement.</li>
      <li>Les étoiles et la progression de l'élève ne sont <strong>pas modifiées</strong>.</li>
      <li>Le mode parent se désactive <strong>automatiquement</strong> dès que tu fermes ou recharges la page : pas besoin de penser à l'éteindre.</li>
    </ul>
    <p style="font-size:12.5px;color:var(--text-muted);margin:14px 0 16px;">Ce réglage est propre à cet appareil/navigateur : il ne change rien pour l'élève sur son propre téléphone.</p>
    <button class="btn btn-primary" id="btn-parent-confirm">Activer le mode parent</button>
  `).querySelector("#btn-parent-confirm").addEventListener("click", ()=>{
    state.unlockAll = true;
    saveState();
    document.querySelector(".modal-overlay").remove();
    renderHome();
  });
}

/* ---------- PLAY SESSION ---------- */
const HEARTS_START = 5;
const ROUND_SIZE_MAX = 10;

function renderPlay(unit){
  if(!session || session.unitId!==unit.id){
    const pool = shuffle(unit.exercises).slice(0, Math.min(ROUND_SIZE_MAX, unit.exercises.length));
    session = {
      unitId: unit.id,
      queue: pool,
      idx: 0,
      hearts: HEARTS_START,
      correctCount: 0,
      total: pool.length,
      answered: false,
      matchState: null
    };
  }
  if(session.hearts<=0){ return renderFail(unit); }
  if(session.idx >= session.queue.length){ return renderResult(unit); }

  const item = session.queue[session.idx];
  const progressPct = Math.round((session.idx/session.total)*100);

  app.innerHTML = `
    <div class="topbar">
      <button class="iconbtn" id="btn-exit">✕</button>
      <div class="progress-track"><div class="progress-fill" style="width:${progressPct}%"></div></div>
      <div class="stat hearts">♥ ${session.hearts}</div>
    </div>
    <div class="card" id="exercise-card"></div>
    <div class="bottom-bar" id="bottom-bar"></div>
  `;
  document.getElementById("btn-exit").addEventListener("click", ()=>{
    if(confirmless("Quit this mission? Your progress in this round will be lost.")) go("");
  });

  renderExercise(item, unit);
}

function confirmless(msg){
  // confirm() is inert in this environment; just proceed (exit always allowed).
  return true;
}

function renderExercise(item, unit){
  const cardEl = document.getElementById("exercise-card");
  const barEl = document.getElementById("bottom-bar");
  session.answered = false;

  if(item.type === "mcq"){
    const trOn = !!state.showTranslations;
    const frHint = (trOn && item.fr) ? `<div class="translation-hint"><span class="flag">🇫🇷</span><span>${item.fr}</span></div>` : "";
    cardEl.innerHTML = `
      <div class="prompt-kicker">${unit.title}</div>
      <p class="prompt">${item.prompt}</p>
      <p class="prompt-sub">${item.sub}</p>
      ${frHint}
      <div class="choices">
        ${item.options.map((opt,i)=>{
          const optFr = (trOn && item.optionsFr && item.optionsFr[opt]) ? `<span class="opt-fr">🇫🇷 ${item.optionsFr[opt]}</span>` : "";
          return `<button class="choice" data-opt="${escapeAttr(opt)}">${opt}${optFr}</button>`;
        }).join("")}
      </div>
    `;
    barEl.innerHTML = `<button class="btn btn-primary" id="btn-check" disabled>Check</button>`;
    let selected = null;
    cardEl.querySelectorAll(".choice").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        if(session.answered) return;
        cardEl.querySelectorAll(".choice").forEach(b=>b.classList.remove("selected"));
        btn.classList.add("selected");
        selected = btn.dataset.opt;
        document.getElementById("btn-check").disabled = false;
      });
    });
    document.getElementById("btn-check").addEventListener("click", ()=>{
      if(!selected || session.answered) return;
      const isCorrect = selected === item.correct;
      session.answered = true;
      cardEl.querySelectorAll(".choice").forEach(b=>{
        b.disabled = true;
        if(b.dataset.opt === item.correct) b.classList.add("correct");
        else if(b.dataset.opt === selected) b.classList.add("wrong");
      });
      showFeedback(isCorrect, item, unit);
    });

  } else if(item.type === "typed"){
    const trOn = !!state.showTranslations;
    const frHint = (trOn && item.fr) ? `<div class="translation-hint"><span class="flag">🇫🇷</span><span>${item.fr}</span></div>` : "";
    cardEl.innerHTML = `
      <div class="prompt-kicker">${unit.title}</div>
      <p class="prompt">${item.prompt}</p>
      <p class="prompt-sub">${item.sub}</p>
      ${frHint}
      <input type="text" class="blank-input" id="typed-input" placeholder="Type your answer..." autocomplete="off" autocapitalize="off" spellcheck="false">
    `;
    barEl.innerHTML = `<button class="btn btn-primary" id="btn-check" disabled>Check</button>`;
    const input = document.getElementById("typed-input");
    input.addEventListener("input", ()=>{
      document.getElementById("btn-check").disabled = input.value.trim().length===0;
    });
    input.addEventListener("keydown", (e)=>{
      if(e.key==="Enter" && !document.getElementById("btn-check").disabled) document.getElementById("btn-check").click();
    });
    setTimeout(()=>input.focus(), 50);
    document.getElementById("btn-check").addEventListener("click", ()=>{
      if(session.answered) return;
      session.answered = true;
      const val = input.value.trim().toLowerCase().replace(/\s+/g," ");
      const isCorrect = item.answers.some(a=>a.toLowerCase()===val);
      input.disabled = true;
      input.classList.add(isCorrect?"correct":"wrong");
      showFeedback(isCorrect, item, unit);
    });

  } else if(item.type === "match"){
    const trOn = !!state.showTranslations;
    const leftItems = shuffle(item.pairs.map((p,i)=>({id:"L"+i, text:p.left, fr:p.leftFr||"", pairId:i})));
    const rightItems = shuffle(item.pairs.map((p,i)=>({id:"R"+i, text:p.right, fr:p.rightFr||"", pairId:i})));
    session.matchState = { matched: new Set(), selectedLeft:null, selectedRight:null, mistakes:0, pairsCount:item.pairs.length };

    const frHint = (trOn && item.fr) ? `<div class="translation-hint"><span class="flag">🇫🇷</span><span>${item.fr}</span></div>` : "";

    cardEl.innerHTML = `
      <div class="prompt-kicker">${unit.title}</div>
      <p class="prompt">${item.prompt}</p>
      <p class="prompt-sub">Tap one item on each side to match them.</p>
      ${frHint}
      <div class="match-cols">
        <div class="match-col" id="col-left">
          ${leftItems.map(li=>`<button class="match-item" data-id="${li.id}" data-pair="${li.pairId}">${li.text}${(trOn && li.fr)?`<span class="item-fr">🇫🇷 ${li.fr}</span>`:""}</button>`).join("")}
        </div>
        <div class="match-col" id="col-right">
          ${rightItems.map(ri=>`<button class="match-item" data-id="${ri.id}" data-pair="${ri.pairId}">${ri.text}${(trOn && ri.fr)?`<span class="item-fr">🇫🇷 ${ri.fr}</span>`:""}</button>`).join("")}
        </div>
      </div>
    `;
    barEl.innerHTML = `<button class="btn btn-primary" id="btn-continue" disabled>Continue</button>`;

    function tryMatch(){
      const ms = session.matchState;
      if(ms.selectedLeft==null || ms.selectedRight==null) return;
      const leftBtn = cardEl.querySelector(`.match-item[data-id="${ms.selectedLeft}"]`);
      const rightBtn = cardEl.querySelector(`.match-item[data-id="${ms.selectedRight}"]`);
      const leftPair = leftBtn.dataset.pair;
      const rightPair = rightBtn.dataset.pair;
      if(leftPair === rightPair){
        leftBtn.classList.remove("selected");
        rightBtn.classList.remove("selected");
        leftBtn.classList.add("matched");
        rightBtn.classList.add("matched");
        ms.matched.add(leftPair);
        ms.selectedLeft = null; ms.selectedRight = null;
        if(ms.matched.size === ms.pairsCount){
          document.getElementById("btn-continue").disabled = false;
          const isCorrect = ms.mistakes===0;
          session.answered = true;
          showFeedback(isCorrect, item, unit, true);
        }
      } else {
        ms.mistakes++;
        leftBtn.classList.add("wrongflash");
        rightBtn.classList.add("wrongflash");
        setTimeout(()=>{
          leftBtn.classList.remove("selected","wrongflash");
          rightBtn.classList.remove("selected","wrongflash");
        }, 450);
        ms.selectedLeft = null; ms.selectedRight = null;
      }
    }

    cardEl.querySelectorAll("#col-left .match-item").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const ms = session.matchState;
        if(btn.classList.contains("matched")) return;
        cardEl.querySelectorAll("#col-left .match-item").forEach(b=>b.classList.remove("selected"));
        btn.classList.add("selected");
        ms.selectedLeft = btn.dataset.id;
        tryMatch();
      });
    });
    cardEl.querySelectorAll("#col-right .match-item").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const ms = session.matchState;
        if(btn.classList.contains("matched")) return;
        cardEl.querySelectorAll("#col-right .match-item").forEach(b=>b.classList.remove("selected"));
        btn.classList.add("selected");
        ms.selectedRight = btn.dataset.id;
        tryMatch();
      });
    });
    document.getElementById("btn-continue").addEventListener("click", ()=> advance());
  }
}

function escapeAttr(s){ return String(s).replace(/"/g,"&quot;"); }

function showFeedback(isCorrect, item, unit, isMatch){
  const barEl = document.getElementById("bottom-bar");
  if(isCorrect){
    session.correctCount++;
  } else {
    session.hearts = Math.max(0, session.hearts-1);
  }
  const panelClass = isCorrect ? "ok" : "ko";
  const emoji = isCorrect ? "🎉" : "😿";
  const title = isCorrect ? pickPraise() : "Not quite!";
  let text = "";
  if(!isCorrect){
    if(item.type==="mcq") text = `Correct answer: <strong>${item.correct}</strong>.`;
    else if(item.type==="typed") text = `Correct answer: <strong>${item.answers[0]}</strong>.`;
    else text = "Some pairs were wrong — check them again next time.";
  }
  if(item.explain) text += (text?" ":"") + item.explain;

  const heartsLostNote = (!isCorrect && session.hearts===0) ? `<p class="hearts-lost-note">Out of hearts...</p>` : "";

  barEl.innerHTML = `
    <div class="feedback-panel ${panelClass}">
      <div class="emoji">${emoji}</div>
      <div>
        <p class="fb-title">${title}</p>
        <p class="fb-text">${text}</p>
      </div>
    </div>
    ${heartsLostNote}
    <button class="btn ${isCorrect?'btn-success':'btn-error'}" id="btn-continue">Continue</button>
  `;
  document.getElementById("btn-continue").addEventListener("click", ()=> advance());
}

function pickPraise(){
  return pick(["Nicely done!","Great job!","Excellent!","You've got it!","Perfect!"],1)[0];
}

function advance(){
  session.idx++;
  const unit = UNITS.find(u=>u.id===session.unitId);
  if(session.hearts<=0){ renderFail(unit); return; }
  render();
}

function renderFail(unit){
  app.innerHTML = `
    <div class="topbar">
      <button class="iconbtn" id="btn-exit">✕</button>
      <div class="progress-track"><div class="progress-fill" style="width:100%;background:var(--error);"></div></div>
      <div class="stat hearts">♥ 0</div>
    </div>
    <div class="result-wrap">
      <div class="result-emoji">😿</div>
      <h2>Out of hearts!</h2>
      <p style="color:var(--text-muted);">Don't worry, review the mistakes and try "${unit.title}" again.</p>
    </div>
    <div class="bottom-bar">
      <button class="btn btn-primary" id="btn-retry">Try again</button>
      <div style="height:8px;"></div>
      <button class="btn btn-ghost" id="btn-home">Back to missions</button>
    </div>
  `;
  document.getElementById("btn-exit").addEventListener("click", ()=>go(""));
  document.getElementById("btn-home").addEventListener("click", ()=>go(""));
  document.getElementById("btn-retry").addEventListener("click", ()=>{ session=null; go("play-"+unit.id); });
}

function renderResult(unit){
  const pct = session.total>0 ? session.correctCount/session.total : 0;
  let stars = 1;
  if(pct>=0.95) stars = 3;
  else if(pct>=0.75) stars = 2;
  const prevStars = unitStars(unit);
  if(stars > prevStars){
    state.completedUnits[unit.id] = { stars, bestScore: session.correctCount };
  } else if(!state.completedUnits[unit.id]){
    state.completedUnits[unit.id] = { stars, bestScore: session.correctCount };
  }
  state.totalXP += session.correctCount * 10;
  registerPlaySession();
  saveState();

  const starsHtml = `<div style="font-size:40px;letter-spacing:6px;">${"★".repeat(stars)}${"☆".repeat(3-stars)}</div>`;

  app.innerHTML = `
    <div class="topbar">
      <button class="iconbtn" id="btn-exit">✕</button>
      <div class="progress-track"><div class="progress-fill" style="width:100%;"></div></div>
      <div class="stat hearts">♥ ${session.hearts}</div>
    </div>
    <div class="result-wrap">
      <div class="result-emoji">🏆</div>
      <h2>Mission complete!</h2>
      ${starsHtml}
      <div class="result-stats">
        <div class="stat-pill">
          <span class="num">${session.correctCount}/${session.total}</span>
          <span class="lbl">Correct</span>
        </div>
        <div class="stat-pill">
          <span class="num">+${session.correctCount*10}</span>
          <span class="lbl">XP</span>
        </div>
        <div class="stat-pill">
          <span class="num">🔥 ${state.streak}</span>
          <span class="lbl">Streak</span>
        </div>
      </div>
    </div>
    <div class="bottom-bar">
      <button class="btn btn-primary" id="btn-continue-home">Continue</button>
    </div>
  `;
  document.getElementById("btn-exit").addEventListener("click", ()=>go(""));
  document.getElementById("btn-continue-home").addEventListener("click", ()=>{ session=null; go(""); });
}

/* ============================================================
   BOOT
   ============================================================ */
function start(hotData){
  if(hotData && hotData.state) state = Object.assign(state, hotData.state);
  render();
}
if(window.claude && window.claude.hot){
  window.claude.hot.snapshot(()=>({ state }));
  window.claude.hot.ready ? window.claude.hot.ready(start) : start(window.claude.hot.data||{});
} else {
  start({});
}

})();
</script>
